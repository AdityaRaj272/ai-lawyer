# Two-colour UI: one red accent + neutral greys. All other accent palettes are mapped to grey
# so alerts (success/info/warning) never introduce green/blue/yellow.

[theme]
baseRadius = "4px"
buttonRadius = "4px"

[theme.light]
primaryColor = "#C62828"
redColor = "#C62828"
redTextColor = "#B71C1C"
redBackgroundColor = "rgba(198, 40, 40, 0.10)"
orangeColor = "#757575"
orangeTextColor = "#424242"
orangeBackgroundColor = "rgba(117, 117, 117, 0.10)"
yellowColor = "#757575"
yellowTextColor = "#424242"
yellowBackgroundColor = "rgba(117, 117, 117, 0.10)"
greenColor = "#757575"
greenTextColor = "#424242"
greenBackgroundColor = "rgba(117, 117, 117, 0.10)"
blueColor = "#757575"
blueTextColor = "#424242"
blueBackgroundColor = "rgba(117, 117, 117, 0.10)"
violetColor = "#757575"
violetTextColor = "#424242"
violetBackgroundColor = "rgba(117, 117, 117, 0.10)"
baseRadius = "4px"
buttonRadius = "4px"

[theme.dark]
primaryColor = "#E53935"
redColor = "#E53935"
redTextColor = "#FF8A80"
redBackgroundColor = "rgba(229, 57, 53, 0.15)"
orangeColor = "#9E9E9E"
orangeTextColor = "#D6D6D6"
orangeBackgroundColor = "rgba(158, 158, 158, 0.12)"
yellowColor = "#9E9E9E"
yellowTextColor = "#D6D6D6"
yellowBackgroundColor = "rgba(158, 158, 158, 0.12)"
greenColor = "#9E9E9E"
greenTextColor = "#D6D6D6"
greenBackgroundColor = "rgba(158, 158, 158, 0.12)"
blueColor = "#9E9E9E"
blueTextColor = "#D6D6D6"
blueBackgroundColor = "rgba(158, 158, 158, 0.12)"
violetColor = "#9E9E9E"
violetTextColor = "#D6D6D6"
violetBackgroundColor = "rgba(158, 158, 158, 0.12)"
baseRadius = "4px"
buttonRadius = "4px"
